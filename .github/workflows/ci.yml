name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RAIZ_API_URL: https://api.example.invalid
      NEXT_PUBLIC_APP_BASE_URL: https://app.example.invalid
      NEXT_PUBLIC_DEPLOYMENT_ENV: test
      NEXT_PUBLIC_STRIPE_PUBLISH_KEY: pk_test_placeholder
      NEXT_PUBLIC_GOOGLE_MAPS_API: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
